[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Check https://hatch.pypa.io/latest/config/metadata/ for all available sections
name = "ansys-fluent-core"
description = "PyFluent provides Pythonic access to Ansys Fluent."
readme = "README.rst"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
maintainers = [{ name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "ansys-api-fluent>=0.7.0",
    "ansys-platform-instancemanagement~=1.1",
    "ansys-tools-common>=0.4.0",
    "ansys-tools-filetransfer>=0.2,<1.0",
    "ansys-units>=0.16,<0.17",
    "defusedxml>=0.7.1",
    "deprecated>=1.2.18",
    "docker>=7.1.0",
    "grpcio>=1.30.0",
    "grpcio-health-checking>=1.30.0",
    "grpcio-status>=1.26.0",
    "grpcio-reflection>=1.30.0",
    "numpy>=1.14.0,<3.0.0",
    "pandas>=1.1.0,<3.0.0",
    "pandas-stubs>=1.1.0,<3.0.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.12",
]
dynamic = ["version"]

[tool.hatch.version]
path = "src/ansys/fluent/core/__init__.py"

# Ship both sibling packages of the ``ansys`` namespace (``ansys.fluent`` and
# ``ansys.solver``). The generated API tree, the ``.pyi`` stubs and the packaged
# README are produced during the build and are gitignored, so they are
# force-included as artifacts.
[tool.hatch.build]
artifacts = [
    "src/ansys/fluent/core/generated/**/*",
    "src/ansys/fluent/core/docs/README.rst",
    "src/ansys/fluent/core/**/*.pyi",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ansys"]

[tool.hatch.build.targets.sdist]
include = ["src/ansys", "LICENSE", "README.rst"]

[project.optional-dependencies]
reader = ["h5py>=3.15.1"]
ui-jupyter = ["ipywidgets>=8.1.8"]
ui = ["panel>=1.8.1"]
search = ["nltk>=3.10.3"]
# gRPC transport. Componentization (#4618) is making gRPC optional so that the
# generic ``ansys.framework`` platform layer imports without it. These
# packages are still part of the core requirements for backward compatibility;
# the ``grpc`` extra pins the target install form (``ansys-fluent-core[grpc]``)
# ahead of their removal from the core dependencies in a later phase.
grpc = [
    "ansys-api-fluent>=0.7.0",
    "grpcio>=1.30.0",
    "grpcio-health-checking>=1.30.0",
    "grpcio-status>=1.26.0",
    "grpcio-reflection>=1.30.0",
]
tests = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-xdist==3.8.0",
    "pyfakefs==6.2.0",
    "docker==7.1.0",
    "numpy==2.5.0",
]
docs = [
    "Sphinx==8.1.3",
    "jupyter_sphinx==0.5.3",
    "numpydoc==1.11.0",
    "matplotlib==3.10.9",
    "ansys-sphinx-theme==1.9.0",
    "pypandoc==1.17",
    "pytest-sphinx==0.7.1",
    "sphinx-autobuild==2024.10.3",
    "sphinx-autodoc-typehints==3.0.1",
    "sphinx-copybutton==0.5.2",
    "sphinx-gallery==0.22.1",
    "sphinx-notfound-page==1.1.0",
    "sphinxcontrib-websupport==2.0.0",
    "sphinx_design==0.6.1",
    "sphinxemoji==0.3.2",
    "sphinx-toggleprompt==0.6.0",
    "autodocsumm==0.2.15",
    "beautifulsoup4==4.15.0",
    "openpyxl>=3.1.5",
    "plotly>=5.22.0",
    "python-pptx>=0.6.23",
    "quarto-cli==1.10.19",
    "pdf2image==1.17.0",
    "seaborn>=0.13.2",
    "docker==7.1.0",
    "numpy==2.5.0",
]
ci_types = [
    "basedpyright==1.40.2",
    "ansys-fluent-visualization",
    "h5py",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pyfakefs",
    "tensorflow",
    "matplotlib",
    "plotly",
    "scikit-learn",
    "seaborn",
    "xgboost",
    "imageio",
    "tomli",
]

[project.urls]
Documentation = "https://fluent.docs.pyansys.com/"
Source = "https://github.com/ansys/pyfluent"
Tracker = "https://github.com/ansys/pyfluent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
--ignore=tests/fluent
--ignore=tests/journals
-v
--durations=0
--show-capture=all
"""
markers = [
    "settings_only: Read and modify the case settings only, without loading the mesh, initializing, or solving the case",
    "nightly: Tests that run under nightly CI",
    "fluent_version(version): Tests that runs with specified Fluent version",
    "standalone: Tests that cannot be run within container",
    "rest_server: Tests that require a live Fluent web server"
]

[tool.black]
extend-exclude = "/(src/ansys/fluent/core/meshing/tui*|src/ansys/fluent/core/solver/tui*|src/ansys/fluent/core/solver/settings*|src/ansys/fluent/core/datamodel*)/"

[tool.isort]
profile = "black"
force_sort_within_sections = true
line_length = 88
default_section = "THIRDPARTY"
skip_glob = [
    "src/ansys/fluent/core/generated"
]
filter_files = "true"
known_first_party = ["ansys"]

[tool.codespell]
skip = """
    *.xml,
    ./src/ansys/fluent/core/generated/*,
    ./src/ansys/fluent/core/codegen/data/fluent_gui_help.xml,
    pyproject.toml,
    CODE_OF_CONDUCT.md,
    devel/field_level_help/field_level_help.csv
    """
ignore-words = ".github/styles/config/vocabularies/ANSYS/accept.txt"

[tool.docformatter]
in-place = "true"
exclude = [
    "tests/",
    "src/ansys/fluent/core/generated/"
]
black = "true"
non-cap = [
    "initDatamodel",
    "getAttributeValue",
    "getState",
    "setState",
    "updateDict",
    "deleteObject",
    "executeCommand",
    "createCommandArguments",
    "deleteCommandArguments",
    "getStaticInfo",
    "subscribeEvents",
    "unsubscribeEvents"
]

[tool.coverage.run]
source = ["ansys/fluent"]
omit = [
    "*/ansys/fluent/core/generated/*"
]

[tool.coverage.report]
show_missing = true

[tool.towncrier]
package = "ansys.fluent.core"
directory = "doc/changelog.d"
filename = "doc/source/changelog.rst"
template = "doc/changelog.d/changelog_template.jinja"
start_string = ".. towncrier release notes start\n"
title_format = "`{version} <https://github.com/ansys/pyfluent/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys/pyfluent/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true

[[tool.towncrier.type]]
directory = "test"
name = "Test"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[tool.bandit]
exclude_dirs = ["src/ansys/fluent/core/generated", "examples", "tests"]
skips = [
    "B403", # Only for pickle module.
    "B404",
    "B405",
    "B602",
    "B603",
    "B604",
    "B607",
    ]

[tool.basedpyright]
reportAny = false
reportUnknownMemberType = false
reportExplicitAny = false
reportPrivateUsage = false
reportUnusedCallResult = false
reportUnannotatedClassAttribute = false
ignore = ["doc", "src/ansys/fluent/core/generated"]
baselineFile = ".ci/basedpyright.json"

# Componentization architecture rules (EPIC #4618). Run locally with
# ``pip install import-linter`` then ``lint-imports``. These contracts run in
# report-only mode in CI during Phase 0 and become blocking in the hardening
# phase. See doc/source/contributing/componentization.rst.
[tool.importlinter]
# ``ansys.api.fluent`` is an external, namespaced (``ansys.*``) package. It is
# listed as a root package so the forbidden contract below can name it directly;
# import-linter does not allow referencing subpackages of squashed external
# packages (the shared ``ansys`` namespace).
root_packages = ["ansys.fluent.core", "ansys.framework", "ansys.api.fluent"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Platform layer is backend-agnostic (ansys.framework must not import grpc / ansys.api / ansys.fluent)"
type = "forbidden"
source_modules = ["ansys.framework"]
forbidden_modules = ["grpc", "ansys.api.fluent", "ansys.fluent.core"]

[[tool.importlinter.contracts]]
name = "Service contracts must not depend on the object framework (flobject)"
type = "forbidden"
source_modules = ["ansys.fluent.core.services"]
forbidden_modules = ["ansys.fluent.core.solver.flobject"]
