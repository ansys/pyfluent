[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-fvm-reference"
version = "0.1.0"
description = "A small, testable finite-volume reference solver foundation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.26",
	"scipy>=1.13",
	"matplotlib>=3.8",
	"jsonschema>=4.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fvm = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"